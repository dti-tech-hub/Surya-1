[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsad"
version = "0.1.0"
description = "Adaptive Domain-Aware Representation Learning for Explainable Time Series Anomaly Detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "omegaconf>=2.3",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "torch>=2.2",
  "lightning>=2.2",
  "mlflow>=2.10",
  "captum>=0.7",
  "shap>=0.45",
  "lime>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "plotly>=5.22",
  "streamlit>=1.33",
  "statsmodels>=0.14",
  "scikit-image>=0.22",
  "tqdm>=4.66",
  "pytest>=8.0",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
