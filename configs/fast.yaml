# Fast config for GPU boxes: default-scale data, fewer epochs, 2-seed CLI override.
seed: 42
device: auto
data:
  name: synthetic
  n_domains: 3
  n_channels: 4
  length: 2000
  window: 64
  stride: 16
  anomaly_ratio: 0.05
model:
  encoder: tcn
  embedding_dim: 32
  num_prototypes: 8
loss: {tau: 0.1, w_nce: 1.0, w_ts2vec: 0.0, w_mask: 0.0, w_sup: 0.0}
augment: [jitter, scaling]
train:
  epochs: 3
  batch_size: 64
  lr: 0.001
align: {method: mmd, use_gate: true, use_weights: true, use_monitor: true,
        alpha: 0.5, beta: 0.1, gamma: 0.01, warmup: 1, cond: false}
tracking: {backend: "off", experiment: tsad-fast}
threshold: {method: percentile, percentile: 95.0}
