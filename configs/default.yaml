# Default config — CPU-safe defaults. Override via CLI: --opt key=value
seed: 42
device: auto  # auto|cpu|cuda
data:
  name: synthetic
  n_domains: 3
  n_channels: 4
  length: 2000
  window: 64
  stride: 16
  anomaly_ratio: 0.05
model:
  encoder: tcn
  embedding_dim: 32
  num_prototypes: 8
train:
  epochs: 5
  batch_size: 64
  lr: 0.001
align:
  method: none
  alpha: 0.1
tracking:
  backend: mlflow  # mlflow|wandb|off
  experiment: tsad-default
threshold:
  method: percentile
  percentile: 95.0
